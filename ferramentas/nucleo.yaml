# Lista curada de actos da UE descarregados por inteiro para corpus/.
#
# Critério: legislação que um negócio digital / comércio electrónico / marca de produtos
# (incluindo cosméticos e equipamentos eléctricos, como lâmpadas UV/LED de unhas) encontra
# na prática. Todos os CELEX foram confirmados no Cellar em 2026-10-09 (existem e, salvo nota,
# estão marcados "em vigor").
#
# Para acrescentar um acto: juntar uma entrada com o CELEX e um nome curto, e correr
#   python3 ferramentas/eurlex.py nucleo --so <CELEX>
# Para encontrar o CELEX: procurar em catalogo/legislacao-em-vigor.tsv.

areas:
  tratados:
    titulo: Tratados e direitos fundamentais
    actos:
      - {celex: 12016M/TXT, curto: TUE}
      - {celex: 12016E/TXT, curto: TFUE}
